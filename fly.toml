# Winpay Simulator API — fly.io config
# Ganti nama app sesuai kebutuhan sebelum deploy
app = "winpay-sim-api"
primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile"


[env]
  API_PORT    = "3001"
  NODE_ENV    = "development"
  DEFAULT_ENV = "development"
  PORT        = "3001"

[http_service]
  internal_port       = 3001
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    timeout      = "5s"
    path         = "/api/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
